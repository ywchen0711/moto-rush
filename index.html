<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="description" content="A pixel-art motorbike racing game: superbike road races and motocross with jumps and tricks.">

<body>
<div id="rotate">↻ 把手機轉成橫向來玩 · Turn your phone sideways</div>
<div id="game">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="ui"></div>
  <div id="touch">
    <div class="pad left"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div class="pad right"><button data-k="nitro" class="nitro">⚡</button><button data-k="brake">▼</button><button data-k="gas" class="gas">▲</button></div>
  </div>
</div>
<script src="js/tracks.js?v=1"></script>
<script src="js/world.js?v=1"></script>
<script src="js/art.js?v=1"></script>
<script src="js/render.js?v=1"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/main.js?v=1"></script>
<script src="/hub.js" data-pos="bottom-left" defer></script>
</body>
</html>
